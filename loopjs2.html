<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<header>
    Loop Gallery
</header>
<style>
    header
    {
        width:100%;
        
        color:white;
        background:black;
        box-shadow:3px 3px 3px gray;
        text-align:center;
        font-size:15px;
        padding:3px;

        font-family:Roboto black;
        justify-content:center;
        display:flex;
    }
    body
    {
        text-align:center;
        margin:0px;
       background-color: aqua;
    }
    
    .pic
    {
        width:150px;
        height:150px;
      
        margin:3px;
        transition:0.50s;

    }
    .pic:hover
    {
        transform:scale(0.80);
          box-shadow:0px 0px 10px rgb(36, 36, 36);
    }
</style>
<body>
    <script>
        for(var i = 1;i<=10;i++)
    {
        document.write("<img src='imgas/p"+i+".jpg' class='pic'>")
    }
    document.title="images"
    </script>
</body>
</html>
