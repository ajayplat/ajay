<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration_in_html</title>
</head>
<style>
    body
    {
        background:#4A4A4A;
        /text-align:center;

    }
    tr
    {
        color:#FFF5F5;
          

    }
    caption
    {
        color:#F7D6D0;
        font-size:30px;
        padding:50px;
        font-family:Abril Fatface;
        
    }
    table
    {
        margin:auto;
        padding:0px;
        box-shadow:4px 4px 4px rgb(136, 136, 136);
        border:1px solid #E2B4BD;
        border-radius:10px;
        margin-top:-10px;
    }
</style>
<body>
    <main>
        <table border="0px" cellpadding="10">
            <form mathod="post" action="">
                <caption>Registration Form</caption>
                <tr>
                    <td><lable>first Name</lable></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><lable>Last Name</lable></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><lable>Age</lable></td>
                    <td><input type="number" max="30" min="10"></td>
                </tr>

                <tr>
                    <td><lable>About Me</lable></td>
                    <td><textarea rows="10" cols="40"></textarea></td>
                </tr>

                <tr>
                    <td><lable>Gender</lable></td>
                    <td>
                        Male<input type="radio" value="Male" checked name="gender">
                        Female<input type="radio" value="Female" name="gender">
                        Other<input type="radio" value="Other" name="gender">
                    </td>
                </tr>
            </form>
        </table>
    </main>
    
</body>
</html>
