<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form_in_html</title>

</head>
<header>Form in html</header>
<style>
    header{
    color:black;
    background:#ffea72;
    font-size:40px;
    padding:10px;
    text-align:center;
    font-family:Arial black;
    }
    caption
    {
        font-size:2rem;
        padding:10px;
        text-align:center;
        margin-left:80px;

    }
    input
    {
        width:100%;
        height:30px;
        background:black;
        color:white;

    }
    table
    {
        width:60%;
        border:2px black solid;
        padding:0px;
        /box-shadow:5px 5px 5px #ffea71;
        border-radius:10px;
        margin-top:auto;
        margin-left:6rem;
        Font-family:Arial black;
        background:white;
        filter:drop-shadow(0px 0px 5px rgba(255, 251, 1, 0.877));

    }

   
    main
    {
        margin:auto;
        width:50%;
    }
    body
    {
        background:linear-gradient(33deg, #ffffff, #e3f771);
        margin:0px;
    }
</style>
<body>
    <main>

        <table border="0px" cellpadding="20">
           
            <caption>Login From</caption>
            <form action="http://ttplay.com/user/form.php" method="post">
               <tr>
                <td ><label for="loginid">Login Id</label></td>
                <td>
                    <input type="text" placeholder="Enter login id" id="loginid" title="type id here" required>
                </td>
               </tr>

               <tr>
                <td><label for="passid">Password</label></td>
                <td>
                    <input type="password" required placeholder="Enter password " id="loginid" title="type password">
                </td>
               </tr>

               <td></td>
               <td>
                <input type="submit" value="login">
                <input type="reset">
               </td>
            </tr>
            </form>
        </table>
    
    </main>
    
</body>
</html>
