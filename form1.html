<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form _in_html</title>

</head>
<header>Form in html</header>
<style>
    header{
    color:black;
    background:#ffd700;
    font-size:40px;
    padding:10px;
    text-align:center;
    font-family:Arial black;
    }
    caption
    {
        font-size:40px;

    }
    input
    {
        width:100%;
        height:30px;

    }
    table
    {
        width:70%;
        border:1px black solid;
        padding:0px;
        box-shadow:5px 5px 5px #ffd700;
        border-radius:10px;
        margin-top:auto;

    }

    nav
{
    background:rgb(145, 145, 145);
    width:100px;
    padding:1px;
    border-radius:20px;
    box-shadow:5px 5px 5px #ffd700;

}
nav ul li:hover
{
background:black;
color:white;
}
nav ul li a:link
{
    color:rgb(255, 255, 255);
    text-decoration:none;
}
nav ul li a:visited
{
    color:black;
}
nav ul li a:hover
{
    color:white;
}
nav ul li:hover a:visited
{
    color:white;
    text-decoration:underline;
}
    main
    {
        margin:auto;
        width:50%;
    }
</style>
<body>
    <main>

        <nav>
        <ul>
            <li><a href="index.html">  Home </a></li>
        </ul>
        </nav>
        <table border="0px" cellpadding="20">
            <caption>login form</caption>
            <form action="http://ttplay.com/user/form.php" method="post">
               <tr>
                <td><label for="loginid">login id</label></td>
                <td>
                    <input type="text" placeholder="Enter login id" id="loginid" title="type id here" required>
                </td>
               </tr>

               <tr>
                <td><label for="passid">password</label></td>
                <td>
                    <input type="password" required placeholder="Enter password " id="loginid" title="type password">
                </td>
               </tr>

               <td></td>
               <td>
                <input type="submit" value="login">
                <input type="reset">
               </td>
            </tr>
            </form>
        </table>
    
    </main>
    
</body>
</html>
