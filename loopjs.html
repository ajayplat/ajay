<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*loop in js : 1 for loop 2 while loop 3 do while loop 4 for in loop 5 for of loop */
        // syntax :- gramer 

        var n = prompt("Enter a Number to create a Table");

        for (var i = 1;i<=10;i++)
        {
            document.write("<h1>"+n+" * "+i+" = "+n*i+" </h1>");
        }

        document.write("Hello loop table ");
        document.title ="Ready"
    </script>
</body>
</html>
